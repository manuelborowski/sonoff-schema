<!DOCTYPE html>
<html lang="nl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <title>{{ 'Apparaten' if page == 'devices' else "Schema's" }} · 🎅 {{ version }}</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/tree.png') }}">
        <link href="{{ url_for('static', filename = 'css/index.css') }}" rel="stylesheet">

</head>
<body>
    <main class="container-fluid py-3">
        <nav class="nav nav-pills justify-content-center mb-3" aria-label="Dashboard">
            <a class="nav-link{% if page == 'devices' %} active{% endif %}" href="{{ url_for('index.hello') }}"{% if page == 'devices' %} aria-current="page"{% endif %}>Apparaten</a>
            <a class="nav-link{% if page == 'schemes' %} active{% endif %}" href="{{ url_for('index.schemes') }}"{% if page == 'schemes' %} aria-current="page"{% endif %}>Schema's</a>
        </nav>
        {% if page == 'devices' %}
        <div class="text-center mb-3">
            <button type="button" id="device-actions-button" class="btn btn-outline-secondary btn-sm" popovertarget="device-actions">Apparaten beheren</button>
        </div>
        <div id="device-actions" class="p-3 border rounded shadow" popover data-url="{{ url_for('index.manage_devices') }}">
            <button type="button" id="add-device" class="btn btn-outline-primary w-100 mb-3">Apparaat toevoegen</button>
            <label for="device-to-delete" class="form-label">Te verwijderen apparaat</label>
            <select id="device-to-delete" class="form-select mb-2"></select>
            <button type="button" id="delete-device" class="btn btn-outline-danger w-100" disabled>Apparaat verwijderen</button>
        </div>
        {% endif %}
        <div class="table-responsive">
            <table class="clickable-table {{ 'sonoff-table' if page == 'devices' else 'scheme-table' }}" aria-label="{{ 'Apparaten' if page == 'devices' else "Schema's" }}"></table>
        </div>
    </main>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" integrity="sha384-mZLF4UVrpi/QTWPA7BjNPEnkIfRFn4ZEO3Qt/HFklTJBj/gBOV8G3HcKn4NfQblz" crossorigin="anonymous"></script>
    <script>const tableRows = {{ rows|tojson }};</script>
    <script type="module" src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
